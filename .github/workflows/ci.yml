name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1 cmake g++
      - run: uv sync --frozen
      - run: make lint typecheck
      - run: make test
      - run: make rt-test
      - run: make train-quick-fixture
      - run: uv run pytest -q tests/test_latency_regression.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      # runner image ships the Android SDK; add the pinned NDK + CMake used by app/build.gradle.kts
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - run: cd android && ./gradlew --no-daemon assembleDebug testDebugUnitTest
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # full-history scan with the repo config (gitleaks-action fails on a repo's first push)
      - run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - run: bash scripts/scan_repo.sh
